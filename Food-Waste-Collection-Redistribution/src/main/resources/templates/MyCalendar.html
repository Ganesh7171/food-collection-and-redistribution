<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Bootstrap -->
    <link rel="stylesheet" 
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />

    <style>
        body {
            background: linear-gradient(135deg, #004080, #0073e6);
            font-family: "Segoe UI", Arial, sans-serif;
            color: #fff;
            padding: 20px;
        }
        .calendar-container {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .calendar-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .calendar-title h3 {
            font-weight: 600;
            color: #004080;
        }
    </style>
</head>
<body>
    <div class="container calendar-container mt-5">
        <div class="calendar-title">
            <!-- Safe dynamic title for all roles -->
            <h3 th:text="${ngo != null ? ngo.organizationName 
                         : (loggedUser != null && loggedUser.userType == 'Restaurant' 
                             ? 'Restaurant Calendar' 
                             : 'Volunteer Calendar')}">
                Calendar
            </h3>
        </div>

        <div id="calendar"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function () {
            const calendarEl = document.getElementById('calendar');
            const ngoId = /*[[${ngo != null ? ngo.ngoId : 0}]]*/ 0; // 0 for non-NGO users

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                events: ngoId > 0 ? `/ngo/${ngoId}/calendar` : `/auth/user/calendar`,
                eventColor: '#0073e6',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                height: 'auto'
            });

            calendar.render();
        });
        /*]]>*/
    </script>
</body>
</html>
