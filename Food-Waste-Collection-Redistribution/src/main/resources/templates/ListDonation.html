<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<head>
  <title>Food Donation Form</title>
  <link rel="stylesheet" th:href="@{/css/ListDonation.css}" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <script th:src="@{/js/sidebar.js}" defer></script>
</head>

<body>
  <!-- Fixed Header -->
  <div th:replace="fragments/header :: app-header"></div>

  <!-- Page Container -->
  
  <div class="page-container">
    <form th:action="@{/fwc/submitDonation}" th:object="${donation}"
          method="post" enctype="multipart/form-data">
      
      <h2>Food Donation Entry</h2>

      <!-- Meal Type Dropdown -->
      <label>Meal Type:</label>
      <select th:field="*{mealType}">
        <option value="Breakfast">Breakfast</option>
        <option value="Lunch">Lunch</option>
        <option value="Snacks">Snacks</option>
        <option value="Dinner">Dinner</option>
      </select><br />

      <!-- Address Options -->
      <label for="enterNew">Address:</label>
      <input class="form-check-input" type="radio" name="addressOption" id="useSaved" 
             value="saved" onclick="toggleAddress(true)" required /> Use Saved Address
      <input class="form-check-input" type="radio" name="addressOption" id="enterNew" 
             value="custom" onclick="toggleAddress(false)" required /> Enter New Address
      <br><br>

      <!-- Address Input -->
      <input type="text" id="addressInput" th:field="*{address}" required />

      <script>
        function toggleAddress(useSaved) {
          const addressInput = document.getElementById("addressInput");
          const googlePlusCodeInput = document.getElementById("googlePlusCode");
          if (useSaved) {
            addressInput.value = /*[[${session.Users.address}]]*/'';
            addressInput.readOnly = true;
            googlePlusCodeInput.value = /*[[${session.Users.googlePlusCode}]]*/'';
            googlePlusCodeInput.readOnly = true;
          } else {
            addressInput.value = '';
            addressInput.readOnly = false;
            googlePlusCodeInput.value = '';
            googlePlusCodeInput.readOnly = false;
          }
        }

        window.onload = function () {
          const saved = document.getElementById("useSaved");
          if (saved.checked) {
            toggleAddress(true);
          }
        };
      </script>

      <!-- Status Dropdown -->
      <label>Status:</label>
      <select th:field="*{status}">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select><br />

      <!-- Google Map Plus Code -->
      <label>Google Map Plus Code:</label>
      <input type="text" id="googlePlusCode" th:field="*{googlePlusCode}" required /><br />

      <!-- Claim Time -->
      <label>Claim Time:</label>
      <input type="datetime-local" th:field="*{claimTime}" /><br />

      <!-- Submit Button -->
      <button type="submit">Submit</button>
    </form>

    <!-- Message -->
    <p th:text="${message}"></p>
  </div>
</body>
</html>
