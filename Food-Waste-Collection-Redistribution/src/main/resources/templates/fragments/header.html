<header th:fragment="app-header">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }

    /* Top bar */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      color: white;
      padding: 10px 20px;
      border-bottom: 3px solid #caf0f8;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1100;
    }

    .hamburger-btn {
      font-size: 22px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .welcome-text {
      font-size: 1.3rem;
      margin: 0;
      flex: 1;
      text-align: center;
    }

    .username { font-weight: 600; color: #ffe066; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .icon-btn:hover { transform: scale(1.2); }

    .account-link {
      background: #023e8a;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    .account-link:hover { background: #03045e; }

    /* Sidebar */
    .side-nav {
      position: fixed;
      top: 30px;
      left: 0;
      width: 200px;
      height: 100%;
      background: #0077b6; /* same as top bar */
      color: white;
      padding: 20px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.3);
      z-index: 1050; /* below header */
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      overflow-y: auto;
    }

    .side-nav.open { transform: translateX(0); }

    .side-nav ul { list-style: none; padding: 0; margin: 0; }
    .side-nav ul li { margin: 15px 0; }
    .side-nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      display: block;
      padding: 6px 8px;
      border-radius: 5px;
      transition: background 0.2s ease;
    }
    .side-nav ul li a:hover {
      background: rgba(255,255,255,0.1);
    }

    .side-nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .side-nav-footer {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 0.9rem;
      color: #ade8f4;
    }

    /* Page content shift */
    #pageContent {
      transition: margin-left 0.3s ease;
      margin-left: 0;
      padding-top: 70px; /* push below fixed header */
    }
    #pageContent.shifted { margin-left: 250px; }

    /* Responsive: sidebar width smaller on mobile */
    @media(max-width: 768px){
      .side-nav { width: 200px; }
      #pageContent.shifted { margin-left: 200px; }
    }
  </style>

  <!-- Top bar -->
  <div class="site-header">
    <button class="hamburger-btn" type="button" onclick="toggleNav()">☰</button>
    <h1 class="welcome-text">
      Welcome, <span class="username" th:text="${session.Users.username}">Guest</span>
    </h1>
    <div class="header-actions">
      <button class="icon-btn">🔔</button>
      <a href="/fwc/myaccount" class="account-link">👤 My Account</a>
      <a href="/logout" class="icon-btn" title="Logout">🚪</a>
    </div>
  </div>

  <!-- Sidebar -->
  <nav id="sideNav" class="side-nav">
    <div class="side-nav-header">
      <h2>Menu</h2>
      <button class="close-btn" type="button" onclick="toggleNav()">&times;</button>
    </div>
    <ul>
      <li><a href="/fwc/Dashboard">Dashboard</a></li>
      <li><a href="/fwc/listAllDonations">All Donations</a></li>
      <li><a href="/fwc/listMyDonations">My Donations</a></li>
      <li><a href="/claims/MyApprovals">My Approvals</a></li>
      <li><a href="/fwc/donationPage">List F.C</a></li>
      <li><a href="/claims/MyClaimRequests">My Claims</a></li>
      <li><a href="/ngo/ngos-list">NGO List</a></li>
      <li><a href="/fwc/mycalendar">My calendar</a></li>
    </ul>
    <div class="side-nav-footer">
      <p>&copy; 2025 Food Waste Collection</p>
    </div>
  </nav>
</header>

<script th:src="@{/js/sidebar.js}" defer></script>
<script>
  function toggleNav() {
    const sidebar = document.getElementById('sideNav');
    const content = document.getElementById('pageContent');
    sidebar.classList.toggle('open');
    content.classList.toggle('shifted');
  }
</script>
