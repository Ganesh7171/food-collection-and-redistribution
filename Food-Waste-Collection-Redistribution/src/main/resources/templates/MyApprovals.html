<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Claim Approvals</title>
<link rel="stylesheet" th:href="@{/css/myapprovals.css}" />
<script th:src="@{/js/sidebar.js}" defer></script>
<style>
   /*  /* body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: white;
        margin: 0;
        padding: 0;
        
    } 
    h1 {
        margin-top: 20px;
        color: #333;
    } 
   
    
</style>
</head>
<body>
    <div th:replace="~{fragments/header :: app-header}"></div>
    <h1>Donation Claim Approvals</h1>
    <div class="search-container">
        <input type="text" id="searchInput"
            placeholder="Search by Donation ID or Requester Name..."
            onkeyup="filterSearch()" />
    </div>
    <div class="tab-container">
        <button class="tab-button active" data-tab="Pending" onclick="switchTab('Pending')">Pending</button>
        <button class="tab-button" data-tab="Actioned" onclick="switchTab('Actioned')">Actioned</button>
    </div>




<div id="PendingSection">
    <div th:each="group : ${groupedPending}">
        <div class="donation-group">
            <div class="group-header" onclick="toggleGroup(this)">
                <span>Donation ID: <strong th:text="${group.key}"></strong></span>
                <span>▼</span>
            </div>
            <div class="group-content" style="display: block;">
                <table class="claims-table">
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Requested By</th>
                            <th>Requested At</th>
                            <th>Comment</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="req : ${group.value}">
                            <td th:text="${req.claimId}"></td>
                            <td><a href="javascript:void(0);"
                                th:text="${req.user.username}"
                                th:onclick="'openCombinedModal(' + ${req.claimId} + ');'"></a></td>
                            <td th:text="${#temporals.format(req.claimTime, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <form th:action="@{/claims/action}" method="post"
                                    onsubmit="return validateComment(this)">
                                    <textarea name="comment" placeholder="Enter comment..."
                                    rows="2" required></textarea>
                                    <input type="hidden" name="id" th:value="${req.claimId}" />
                                    <button type="submit" name="action" value="approve"
                                        class="btn approve">Approve</button>
                                    <button type="submit" name="action" value="reject"
                                        class="btn reject">Reject</button>
                                    <button type="submit" name="action" value="refer-back"
                                        class="btn refer">Refer Back</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="ActionedSection" style="display: none;">
    <div th:each="group : ${groupedActioned}">
        <div class="donation-group">
            <div class="group-header" onclick="toggleGroup(this)">
                <span>Donation ID: <strong th:text="${group.key}"></strong></span>
                <span>▼</span>
            </div>
            <div class="group-content" style="display: block;">
                <table class="claims-table">
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Requested By</th>
                            <th>Status</th>
                            <th>Action Time</th>
                            <th>Comment</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="req : ${group.value}">
                            <td th:text="${req.claimId}"></td>
                            <td><a href="javascript:void(0);"
                                th:text="${req.user.username}"
                                th:onclick="'openCombinedModal(' + ${req.claimId} + ');'"></a></td>
                            <td th:text="${req.claimStatus}"></td>
                            <td th:text="${#temporals.format(req.actionTime, 'yyyy-MM-dd HH:mm')}"></td>
                            <td th:text="${req.comment}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:each="req : ${allClaims}">
    <div class="modal" th:id="'combinedModal' + ${req.claimId}">
        <div class="modal-content">
            <span class="close" onclick="closeModal(this)">&times;</span>
            <h3>Donation Claim Details</h3>
            <hr />
            <p><strong>Donation Item:</strong> <span th:text="${req.donation.mealType}"></span></p>
            <p><strong>Google Plus Code:</strong> <span th:text="${req.donation.googlePlusCode}"></span></p>
            <p><strong>Requested By:</strong> <span th:text="${req.user.username}"></span></p>
            <p><strong>Email:</strong> <span th:text="${req.user.emailAddress}"></span></p>
            <p><strong>Phone:</strong> <span th:text="${req.user.phoneNumber}"></span></p>
        </div>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelector(`.tab-button[data-tab='${tab}']`).classList.add('active');
        document.getElementById('PendingSection').style.display = (tab === 'Pending') ? 'block' : 'none';
        document.getElementById('ActionedSection').style.display = (tab === 'Actioned') ? 'block' : 'none';
    }
    function toggleGroup(header) {
        const content = header.nextElementSibling;
        content.style.display = (content.style.display === 'none') ? 'block' : 'none';
    }
    function openCombinedModal(id) {
        document.getElementById('combinedModal' + id).style.display = 'block';
    }
    function closeModal(span) {
        span.closest('.modal').style.display = 'none';
    }
    window.onclick = function(e) {
        if (e.target.classList.contains('modal')) e.target.style.display = 'none';
    }
    function validateComment(form) {
        const textarea = form.querySelector('textarea[name="comment"]');
        if (!textarea.value.trim()) {
            alert('Please enter a comment before taking action.');
            return false;
        }
        return true;
    }
    function filterSearch() {
        const searchValue = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.donation-group').forEach(group => {
            const donationId = group.querySelector('.group-header strong').textContent.toLowerCase();
            const requesterNames = Array.from(group.querySelectorAll('tbody td:nth-child(2)')).map(td => td.textContent.toLowerCase());
            const match = donationId.includes(searchValue) || requesterNames.some(n => n.includes(searchValue));
            group.style.display = match ? '' : 'none';
        });
    }
</script>


</body>
</html>
