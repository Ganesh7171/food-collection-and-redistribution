<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Account</title>
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/Myaccount.css}" />
    <!-- <script th:src="@{/js/myaccount.js}" defer></script> -->
    <script th:src="@{/js/sidebar.js}" defer></script>
</head>

<body>
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: app-header}"></div>

    <div class="account-container">
        <h1>My Account</h1>

        <!-- User Basic Info -->
        <div class="user-info-card">
            <h2>Profile Information</h2>
            <form th:action="@{/auth/updateUser}" th:object="${user}" method="post">
                <div class="info-grid">
                    <div>
                        <input type="hidden" th:field="*{userId}" />
                        <label>Name</label>
                        <input type="text" th:field="*{username}" readonly />
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" th:field="*{emailAddress}" readonly />
                    </div>
                    <div>
                        <label>Address</label>
                        <input type="text" th:field="*{address}" readonly />
                    </div>
                    <div>
                        <label>Phone</label>
                        <input type="text" th:field="*{phoneNumber}" readonly />
                    </div>
                    <div>
                        <label>Google Plus Code</label>
                        <input type="text" th:field="*{googlePlusCode}" readonly />
                    </div>
                </div>

                <button type="button" class="btn-edit" onclick="enableEdit()">Edit</button>
                <button type="submit" class="btn-save" style="display:none;">Save</button>
            </form>
        </div>

        <!-- NGO Details -->
        <div th:if="${user.userType == 'NGO'}" class="ngo-section">
            <h2>NGO Details</h2>
            <form th:action="@{/auth/updateNgo}" th:object="${ngoDetails}"
                  method="post" enctype="multipart/form-data">

                <div class="info-grid">
                    <div>
                        <label>Organization Name</label>
                        <input type="text" th:field="*{organizationName}" readonly />
                    </div>
                    <div>
                        <label>Donation Types</label>
                        <input type="text" th:field="*{donationTypes}" readonly />
                    </div>
                    <div>
                        <label>Visiting Hours</label>
                        <input type="text" th:field="*{visitingHours}" readonly />
                    </div>
                    <div>
                        <label>NGO Photo</label><br/>
                        <img th:if="${user.ngoDetails.imageData != null}"
                        
                             th:src="@{'/auth/ngo-image/' + ${ngoDetails.ngoId}}"
                             
                             alt="NGO Image" width="150" height="150"/><br/>
                        <input type="file" name="file" accept="image/*"/>
                    </div>
                    <div>
                        <label>Address</label>
                        <input type="text" th:field="*{user.address}" readonly/>
                    </div>
                    <div>
                        <label>Phone</label>
                        <input type="text" th:field="*{user.phoneNumber}" readonly/>
                    </div>
                    <div>
                        <label>Google Plus Code</label>
                        <input type="text" th:field="*{user.googlePlusCode}" readonly/>
                    </div>
                </div>

                <button type="button" class="btn-edit" onclick="enableEdit()">Edit</button>
                <button type="submit" class="btn-save" style="display:none;">Update NGO Details</button>
            </form>

            <!-- Donation Summary -->
            <div class="donation-summary">
                <h3>Donation Statistics</h3>
                <div class="stats">
                    <div class="stat-card">
                        <h4>Donations Made</h4>
                        <p th:text="${donationsMade}">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Donations Received</h4>
                        <p th:text="${donationsReceived}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Volunteer Details -->
        <div th:if="${user.userType == 'Volunteer'}" class="vol-section">
            <h2>Volunteer Details</h2>
            <form th:action="@{/fwc/updateVolunteer}" th:object="${user.volunteerDetails}" method="post">
                <div class="info-grid">
                    <div>
                        <label>Skills</label>
                        <input type="text" th:field="*{skills}" readonly/>
                    </div>
                    <div>
                        <label>Availability</label>
                        <input type="text" th:field="*{availability}" readonly/>
                    </div>
                </div>

                <button type="button" class="btn-edit" onclick="enableEdit()">Edit</button>
                <button type="submit" class="btn-save" style="display:none;">Save</button>
            </form>

            <!-- Donation Summary -->
            <div class="donation-summary">
                <h3>Donation Statistics</h3>
                <div class="stats">
                    <div class="stat-card">
                        <h4>Donations Made</h4>
                        <p th:text="${donationsMade}">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Donations Received</h4>
                        <p th:text="${donationsReceived}">0</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

<script>
    function enableEdit() {
        document.querySelectorAll('input[readonly]').forEach(inp => inp.removeAttribute('readonly'));
        document.querySelectorAll('.btn-save').forEach(btn => btn.style.display = 'inline-block');
    }
</script>
</body>
</html>
