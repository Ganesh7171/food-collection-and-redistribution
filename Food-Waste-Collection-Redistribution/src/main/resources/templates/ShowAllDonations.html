<!-- Extra Fi	<!DOCTYPE html>
	<html xmlns:th="http://www.thymeleaf.org">
	<head>
	  <meta charset="UTF-8" />
	  <title>Donations</title>
	  <meta name="viewport" content="width=device-width, initial-scale=1" />
	
	  <!-- Bootstrap -->
	  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />
	  <link rel="stylesheet" th:href="@{/css/ShowAllDonations.css}" />
	</head>
	<body>
	
	   <div th:replace="~{fragments/header :: app-header}"></div>
	
	  <!-- Page Content -->
	  <div id="pageContent">
	
	    <!-- Search + Filter + Sort -->
	    <form method="get" th:action="@{/fwc/listAllDonations}" class="controls-bar form-inline" style="margin:15px;">
	      <!-- Search -->
	      <div class="form-group">
	        <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by Donation ID..." />
	      </div>
	
	      <!-- Status Filter -->
	      <div class="form-group">
	        <select name="status" class="form-control" th:value="${status}">
	          <option value="">All Status</option>
	          <option value="AVAILABLE">Available</option>
	          <option value="CLAIMED">Claimed</option>
	          <option value="EXPIRED">Expired</option>
	        </select>
	      </div>
	
	      <!-- Meal Filter -->
	      <div class="form-group">
	        <select name="meal" class="form-control" th:value="${meal}">
	          <option value="">All Meals</option>
	          <option value="Breakfast">Breakfast</option>
	          <option value="Lunch">Lunch</option>
	          <option value="Dinner">Dinner</option>
	        </select>
	      </div>
	
	      <!-- Sort -->
	      <div class="form-group">
	        <select name="sortBy" class="form-control" th:value="${sortBy}">
	          <option value="donationId">ID</option>
	          <option value="claimTime">Claim Time</option>
	        </select>
	        <select name="order" class="form-control" th:value="${order}">
	          <option value="desc">Descending</option>
	          <option value="asc">Ascending</option>
	        </select>
	      </div>
	
	      <button type="submit" class="btn btn-primary">Apply</button>
	    </form>
	
	    <!-- Cards -->
	    <div class="cards" id="cards">
	     <div class="donation-card"
	     th:each="donation : ${donations}"
	     th:attr="
	        data-donation-id=${donation.donationId},
	        data-meal-type=${donation.mealType},
	        data-status=${donation.status},
	        data-claim-time=${donation.claimTime},
	        data-address=${donation.address},
	        data-google-plus-code=${donation.googlePlusCode},
	        data-username=${donation.user != null ? donation.user.username : 'N/A'},
	        data-mobile=${donation.user != null ? donation.user.phoneNumber : 'N/A'}
	     "
	     onclick="showDetailsFromCard(this)">
	
	        <div class="card-header">
	          <span class="meal-type" th:text="${donation.mealType}">Meal</span>
	          <span class="status-badge" th:text="${donation.status}">Status</span>
	        </div>
	        <div class="card-body">
	          <div class="pair">
	            <span class="k">ID</span>
	            <span class="v" th:text="${donation.donationId}">1</span>
	          </div>
	          <div class="pair">
	            <span class="k">Claim Time</span>
	            <span class="v" th:text="${donation.claimTime}">2025-06-22T10:30</span>
	          </div>
	        </div>
	        <div class="card-actions">
	          <button class="btn btn-primary btn-xs"
	                  th:disabled="${donation.status == 'CLAIMED'}"
	                  th:text="${donation.status == 'CLAIMED'} ? 'Request Already Placed' : 'Place Request'"
	                  th:onclick="'event.stopPropagation();openClaimPopup(' + '\'' + ${donation.donationId} + '\'' + ')'">
	          </button>
	        </div>
	      </div>
	    </div>
	
	   <!-- Pagination -->
<nav aria-label="Page navigation" style="margin-top:20px; text-align:center;">
  <ul class="pagination">
    <li th:classappend="${currentPage == 0} ? 'disabled'">
      <a th:href="@{/fwc/listAllDonations(page=${currentPage-1}, size=8, search=${search}, status=${status}, meal=${meal}, sortBy=${sortBy}, order=${order})}">&laquo;</a>
    </li>

    <li th:each="i : ${#numbers.sequence(0, totalPages-1)}"
        th:classappend="${i == currentPage} ? 'active'">
      <a th:text="${i+1}"
         th:href="@{/fwc/listAllDonations(page=${i}, size=8, search=${search}, status=${status}, meal=${meal}, sortBy=${sortBy}, order=${order})}"></a>
    </li>

    <li th:classappend="${currentPage == totalPages-1} ? 'disabled'">
      <a th:href="@{/fwc/listAllDonations(page=${currentPage+1}, size=8, search=${search}, status=${status}, meal=${meal}, sortBy=${sortBy}, order=${order})}">&raquo;</a>
    </li>
  </ul>
</nav>

	
	 <!-- Details Panel -->
<aside class="details-pane" id="detailsPane" aria-hidden="true">
  <button class="details-close" type="button" onclick="closeDetails()">✕</button>
  <div id="detailsBody" class="details-body"></div>
</aside>

	
	    <!-- Claim Modal -->
	    <div id="claimModal" class="modal fade" role="dialog">
	      <div class="modal-dialog modal-lg">
	        <div class="modal-content">
	          <div class="modal-header">
	            <h4 class="modal-title">Claim Food Donation</h4>
	            <button type="button" class="close" data-dismiss="modal">&times;</button>
	          </div>
	          <div class="modal-body">
	            <form id="claimForm">
	              <input type="hidden" id="donationIdField" name="donation.donationId" />
	              <input type="hidden" name="user.userId" th:value="${session.Users.userId}" />
	
	              <div class="form-inline">
	                <label class="mr-10">Request For:</label>
	                <label><input type="radio" name="requestForOption" value="saved" onclick="toggleAddress(true)" /> Self</label>
	                <label><input type="radio" name="requestForOption" value="custom" onclick="toggleAddress(false)" /> For others</label>
	              </div>
	
	              <div class="form-group">
	                <label for="claimerName">Your Name</label>
	                <input type="text" class="form-control" id="claimerName" name="claimerName" required />
	              </div>
	
	              <div class="form-group">
	                <label for="contactNumber">Contact Number</label>
	                <input type="text" class="form-control" id="contactNumber" name="contactNumber" required />
	              </div>
	
	              <div class="form-group">
	                <label for="addressInput">Claim Address</label>
	                <input type="text" class="form-control" id="addressInput" name="claimedAddress" required />
	              </div>
	
	              <div class="form-group">
	                <label for="googlePlusCode">Google Plus Code</label>
	                <input type="text" class="form-control" id="googlePlusCode" name="googlePlusCode" required />
	              </div>
	
	              <div class="form-actions" style="text-align:center;">
	                <button type="submit" class="btn btn-primary">Submit Claim</button>
	              </div>
	            </form>
	          </div>
	        </div>
	      </div>
	    </div>
	
	  </div> <!-- /#pageContent -->
	<div id="detailsScrim" onclick="closeDetails()"></div>



	
	  <!-- JS -->
	  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
	  <script th:src="@{/js/ShowAllDonations.js}"></script>
	  <script th:inline="javascript">
  function toggleAddress(useSaved) {
    const userNameInput = document.getElementById("claimerName");
    const contactNumberInput = document.getElementById("contactNumber");
    const addressInput = document.getElementById("addressInput");
    const googlePlusCodeInput = document.getElementById("googlePlusCode");

    if (useSaved) {
      userNameInput.value       = /*[[${session.Users.username}]]*/ "";
      contactNumberInput.value  = /*[[${session.Users.phoneNumber}]]*/ "";
      addressInput.value        = /*[[${session.Users.address}]]*/ "";
      googlePlusCodeInput.value = /*[[${session.Users.googlePlusCode}]]*/ "";

      userNameInput.readOnly =
      contactNumberInput.readOnly =
      addressInput.readOnly =
      googlePlusCodeInput.readOnly = true;
    } else {
      userNameInput.value =
      contactNumberInput.value =
      addressInput.value =
      googlePlusCodeInput.value = "";

      userNameInput.readOnly =
      contactNumberInput.readOnly =
      addressInput.readOnly =
      googlePlusCodeInput.readOnly = false;
    }
  }
</script>
	  
	</body>
	</html>
