<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Donations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8f5;
            padding: 20px;
        }
        .card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
            margin: 20px auto;
            max-width: 700px;
        }
        h2 {
            color: #2e7d32;
        }
        .info-row {
            margin: 10px 0;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
        .value {
            margin-left: 10px;
            color: #222;
        }
    </style>
</head>
<body>

<div th:each="d : ${donations}" class="card">
    <h2>Donation Details</h2>
    <div class="info-row"><span class="label">Donation ID:</span><span class="value" th:text="${d.donationId}"></span></div>
    <div class="info-row"><span class="label">Meal Type:</span><span class="value" th:text="${d.mealType}"></span></div>
    <div class="info-row"><span class="label">Address:</span><span class="value" th:text="${d.address}"></span></div>
    <div class="info-row"><span class="label">Status:</span><span class="value" th:text="${d.status}"></span></div>
    <div class="info-row"><span class="label">Google Plus Code:</span><span class="value" th:text="${d.googlePlusCode}"></span></div>
    <div class="info-row"><span class="label">Claim Time:</span><span class="value" th:text="${#temporals.format(d.claimTime, 'yyyy-MM-dd HH:mm')}"></span></div>

    <hr style="margin: 20px 0;">

    <h2>User Details</h2>
    <div class="info-row"><span class="label">User ID:</span><span class="value" th:text="${d.user.userId}"></span></div>
    <div class="info-row"><span class="label">Username:</span><span class="value" th:text="${d.user.username}"></span></div>
    <div class="info-row"><span class="label">Email:</span><span class="value" th:text="${d.user.emailAddress}"></span></div>
    <div class="info-row"><span class="label">Phone:</span><span class="value" th:text="${d.user.phoneNumber}"></span></div>
    <div class="info-row"><span class="label">User Type:</span><span class="value" th:text="${d.user.userType}"></span></div>
    <div class="info-row"><span class="label">User Address:</span><span class="value" th:text="${d.user.address}"></span></div>
    <div class="info-row"><span class="label">Google Plus Code:</span><span class="value" th:text="${d.user.googlePlusCode}"></span></div>
</div>

</body>
</html>
