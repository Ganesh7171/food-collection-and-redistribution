<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome Screen - Food Waste Collection</title>
    <link rel="stylesheet" th:href="@{/css/Dashboard.css}" />
    <link rel="stylesheet" th:href="@{/css/loader.css}" />
</head>
<body>

    <!-- Loader Animation -->
    <div id="loader-wrapper">
        <div id="loader">🍱</div>
    </div>

    <div class="header">
        <h1 th:text="'Welcome ' + ${session.Users.username}">WELCOME GUEST !!</h1>
        <div class="header-icon">
            <button>🔔</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <ul>
                <li><a href="/fwc/listAllDonations">All Donations</a></li>
                <li><a href="/fwc/listMyDonations">My Donations</a></li>
                <li><a href="/fwc/DonationClaimForm">Claim Form</a></li>
                <li><a href="/fwc/donationPage">List F.C</a></li>
                 <li><a href="/claims/MyClaimRequests">My Claims</a></li>
            </ul>
        </div>

        <div class="main-content">
            <section>
                <h2>F.D</h2>
            </section>
            <section>
                <h2>Total Count</h2>
            </section>
            <section>
                <h2>Track F.D</h2>
            </section>
        </div>
    </div>

    <div class="admin-section">
        <h3>Admin</h3>
    </div>

    <script>
        // Hide loader after full load
        window.addEventListener('load', function () {
            const loader = document.getElementById('loader-wrapper');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        });

        // Show loader when navigating
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
                    document.getElementById('loader-wrapper').style.display = 'flex';
                    document.getElementById('loader-wrapper').style.opacity = '1';
                }
            });
        });
    </script>
</body>
</html>
