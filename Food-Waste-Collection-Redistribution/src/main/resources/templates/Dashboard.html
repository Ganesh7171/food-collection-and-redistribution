<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Food Waste Collection</title>
  <!-- Common theme -->
  <link rel="stylesheet" th:href="@{/css/Dashboard.css}" />
  <link rel="stylesheet" th:href="@{/css/loader.css}" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Loader -->
  <div id="loader-wrapper">
    <div id="loader">🍱</div>
  </div>

  <!-- Common Header -->
  <div th:replace="fragments/header :: app-header"></div>

  <!-- Common Sidebar -->
  <div th:replace="fragments/sidebar :: app-sidebar"></div>

  <!-- Page Content -->
  <div id="pageContent" class="page-content">
    <main class="main-container">
      <section class="card">
        <h2>Dashboard</h2>
        <p>Welcome to your dashboard. Here you can track food donations and requests.</p>
      </section>
      <section class="card">
        <h2>Total Count</h2>
        <p>Show analytics or total donations here.</p>
      </section>
      <section class="card">
        <h2>Track F.D</h2>
        <p>Tracking and claim requests will be shown here.</p>
      </section>
    </main>

    <!-- Common Footer -->
    <div th:replace="fragments/footer :: app-footer"></div>
  </div>

  <!-- Scripts -->
  <script>
    // Loader
    window.addEventListener('load', function () {
      const loader = document.getElementById('loader-wrapper');
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
    });

    // Show loader on navigation
    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function () {
        const href = this.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript')) {
          const loader = document.getElementById('loader-wrapper');
          loader.style.display = 'flex';
          loader.style.opacity = '1';
        }
      });
    });

    // Sidebar toggle
    function toggleNav() {
      document.getElementById('sideNav').classList.toggle('open');
      document.getElementById('pageContent').classList.toggle('shifted');
    }
  </script>
</body>
</html>
